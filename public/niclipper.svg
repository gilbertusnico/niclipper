<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Gunting - Niclipper Logo -->
  <!-- Bilah kiri -->
  <path d="M58 16 C54 30, 38 52, 20 76" 
        stroke="url(#purpleGrad)" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <!-- Bilah kanan -->
  <path d="M58 16 C62 30, 78 52, 96 76" 
        stroke="url(#purpleGrad)" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <!-- Pin tengah -->
  <circle cx="58" cy="16" r="6" fill="url(#purpleGrad)"/>
  <!-- Gagang kiri -->
  <ellipse cx="20" cy="82" rx="8" ry="10" stroke="url(#purpleGrad)" stroke-width="4" fill="none" transform="rotate(-20 20 82)"/>
  <!-- Gagang kanan -->
  <ellipse cx="96" cy="82" rx="8" ry="10" stroke="url(#purpleGrad)" stroke-width="4" fill="none" transform="rotate(20 96 82)"/>
  <!-- Garis potong (hasil guntingan) -->
  <line x1="34" y1="46" x2="46" y2="58" stroke="#4338CA" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="82" y1="46" x2="70" y2="58" stroke="#4338CA" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <!-- Gradien -->
  <defs>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
  </defs>
</svg>